<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/x-icon"
      href="../../assets/icons/favicon.ico"
    />
    <title>Đang làm bài thi - Study Space</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/take_quiz.css" />
    <link rel="stylesheet" href="/css/toast.css" />
  </head>
  <body class="bg-light">
    <!-- Màn hình chờ để kích hoạt Fullscreen -->
    <div id="start-overlay" class="start-overlay">
      <div class="text-center bg-white p-5 rounded-4 shadow">
        <h3 class="fw-bold mb-3">Bạn đã sẵn sàng chưa?</h3>
        <p class="text-muted mb-4">
          Hệ thống sẽ chuyển sang chế độ toàn màn hình để làm bài.
        </p>
        <button
          id="btn-start-quiz-now"
          class="btn btn-primary btn-lg rounded-pill px-5 fw-bold"
        >
          <i class="bx bx-play-circle me-1"></i> Bắt đầu làm bài
        </button>
        <div class="mt-3">
          <a href="/" class="text-muted small text-decoration-none">Quay lại</a>
        </div>
      </div>
    </div>

    <!-- Giao diện làm bài -->
    <div id="quiz-workspace" class="d-none">
      <!-- Header -->
      <header
        class="quiz-header bg-white shadow-sm d-flex justify-content-between align-items-center px-4 py-3"
      >
        <div class="d-flex align-items-center gap-3">
          <button
            id="btn-back-quiz"
            class="btn btn-outline-secondary rounded-pill btn-sm d-flex align-items-center"
          >
            <i class="bx bx-arrow-back me-1"></i> Quay lại
          </button>
          <h5 class="fw-bold m-0" id="quiz-title-display">
            Đang tải dữ liệu...
          </h5>
        </div>
        <!-- Khối thời gian (Sẽ bị JS ẩn nếu là chế độ có đáp án ngay) -->
        <div
          id="timer-container"
          class="quiz-timer bg-dark text-white fw-bold px-4 py-2 rounded-pill fs-5 d-flex align-items-center"
        >
          <i class="bx bx-time-five me-2"></i>
          <span id="timer-display">00:00</span>
        </div>
      </header>

      <!-- Main Layout -->
      <main class="container-fluid px-5 pt-5 pb-4">
        <div class="row h-100">
          <!-- Cột 1: Thông tin câu hỏi (col-1) -->
          <div class="col-md-1">
            <div class="card border-0 shadow-sm rounded-4 text-center p-3">
              <h5 class="fw-bold text-dark mb-4 mt-2">
                Câu <br /><span id="current-q-num" class="text-primary fs-3"
                  >1</span
                >
              </h5>
              <button
                class="btn btn-light border d-flex flex-column align-items-center justify-content-center mx-auto mb-4 flag-btn"
                style="width: 70px; height: 70px; border-radius: 12px"
              >
                <i class="bx bx-flag fs-3 text-secondary mb-1 flag-icon"></i>
                <span
                  class="small fw-semibold text-secondary"
                  style="font-size: 11px"
                  >Gắn cờ</span
                >
              </button>
              <div
                id="question-score-display"
                class="score-badge bg-light text-dark fw-bold py-2 rounded-3 small"
              >
                Đang tính...
              </div>
            </div>
          </div>

          <!-- Cột 2: Nội dung câu hỏi (col-7) -->
          <div class="col-md-7">
            <div
              class="card border-0 shadow-sm rounded-4 p-4 h-100 d-flex flex-column"
            >
              <div class="flex-grow-1">
                <!-- Nội dung câu hỏi -->

                <h5
                  class="fw-bold mb-3"
                  id="question-text"
                  style="line-height: 1.6"
                >
                  Đang tải câu hỏi...
                </h5>

                <!-- BỔ SUNG: Khu vực hiển thị hình ảnh đính kèm của câu hỏi -->
                <div
                  id="question-images-area"
                  class="d-flex flex-column gap-3 mb-4"
                >
                  <!-- Javascript sẽ sinh ra các thẻ <img> ở đây -->
                </div>

                <!-- Danh sách đáp án -->
                <div id="options-area" class="d-flex flex-column gap-3 mb-4">
                  <!-- JS Render options -->
                </div>

                <!-- Khu vực xem đáp án (Chỉ hiển thị ở chế độ Immediate) -->
                <div
                  id="immediate-feedback-area"
                  class="d-none border-top pt-4 mt-2"
                >
                  <button
                    id="btn-toggle-answer"
                    class="btn btn-outline-primary rounded-pill btn-sm fw-bold px-3 mb-3"
                  >
                    <i class="bx bx-show me-1"></i> Xem đáp án
                  </button>
                  <div
                    id="explanation-box"
                    class="bg-light p-3 rounded-3 border d-none"
                  >
                    <p class="fw-bold text-success mb-2">
                      Đáp án đúng: <span id="correct-answer-text"></span>
                    </p>
                    <p
                      class="text-muted mb-0 small"
                      id="explanation-text"
                      style="line-height: 1.6"
                    ></p>
                  </div>
                </div>
              </div>

              <!-- Footer điều hướng (Nằm dưới cùng cột 2) -->
              <div
                class="d-flex justify-content-between align-items-center mt-4 pt-3 border-top"
              >
                <button
                  id="btn-prev-question"
                  class="btn btn-light border fw-bold px-4 rounded-pill text-secondary"
                >
                  <i class="bx bx-left-arrow-alt me-1"></i> Câu trước
                </button>
                <button
                  id="btn-next-question"
                  class="btn btn-primary fw-bold px-4 rounded-pill"
                >
                  Câu sau <i class="bx bx-right-arrow-alt ms-1"></i>
                </button>
              </div>
            </div>
          </div>

          <!-- Cột 3: Lưới điều hướng câu hỏi (col-4) -->
          <div class="col-md-4">
            <div
              class="card border-0 shadow-sm rounded-4 p-4 h-100 d-flex flex-column"
            >
              <h6
                class="fw-bold mb-4 d-flex justify-content-between align-items-center"
              >
                <span>Bảng câu hỏi</span>
                <span
                  class="badge bg-primary rounded-pill px-3 py-2"
                  id="completed-count"
                  >0/10</span
                >
              </h6>

              <!-- Lưới Grid 6 ô 1 hàng -->
              <div
                class="question-grid flex-grow-1 align-content-start"
                id="question-navigation-grid"
              >
                <!-- JS sinh ô số -->
              </div>

              <!-- Nút Làm xong! có gạch chân dạng thẻ a -->
              <div class="mt-4 pt-3 border-top text-center">
                <a
                  href="#"
                  id="btn-finish-quiz"
                  class="text-dark fw-bold text-decoration-underline fs-6"
                  >Làm xong!</a
                >
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- MODAL: XÁC NHẬN CHUNG (THAY THẾ CONFIRM) -->
    <div class="modal fade" id="confirmModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-sm">
        <div class="modal-content rounded-4 border-0 shadow">
          <div class="modal-header border-bottom-0 pt-4 px-4 pb-0">
            <h5 class="modal-title fw-bold text-dark">
              <i class="bx bx-error-circle text-danger me-2"></i>Xác nhận
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div
            class="modal-body px-4 py-3 text-secondary fw-semibold"
            id="confirmModalMessage"
          >
            <!-- Nội dung sẽ được đưa vào bằng JS -->
          </div>
          <div
            class="modal-footer border-top-0 pb-4 px-4 d-flex justify-content-end gap-2"
          >
            <button
              type="button"
              class="btn btn-light fw-bold px-4 rounded-3"
              data-bs-dismiss="modal"
            >
              Hủy
            </button>
            <button
              type="button"
              class="btn btn-primary fw-bold px-4 rounded-3"
              id="confirmModalBtn"
            >
              Đồng ý
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="/js/toast.js"></script>
    <script src="/js/take_quiz.js"></script>
  </body>
</html>
