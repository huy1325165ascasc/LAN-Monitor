<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản lý Đề Thi - Giám Thị</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/quiz.css" />
    <link rel="stylesheet" href="/css/toast.css" />
  </head>
  <body class="bg-light">
    <div class="container py-4" id="quiz-container">
      <div class="row mb-4">
        <div
          class="col-12 d-flex justify-content-between align-items-center flex-wrap gap-3"
        >
          <h3 class="fw-bold m-0 d-flex align-items-center text-dark">
            <i class="bx bx-edit-alt text-primary me-2"></i> Soạn Đề Thi Trắc
            Nghiệm
          </h3>
          <div class="d-flex align-items-center gap-2">
            <a
              href="/admin"
              class="btn btn-outline-secondary rounded-pill fw-semibold me-2"
            >
              <i class="bx bx-arrow-back me-1"></i> Về Dashboard
            </a>
            <button
              id="btn-copy-prompt"
              class="btn btn-outline-primary rounded-pill fw-semibold d-flex align-items-center"
            >
              <i class="bx bx-copy me-1"></i> Sao chép lệnh AI
            </button>
            <!-- Bắt buộc phải có data-bs-toggle và data-bs-target -->
            <button
              class="btn btn-primary rounded-pill fw-semibold d-flex align-items-center shadow-sm"
              data-bs-toggle="modal"
              data-bs-target="#addQuizModal"
            >
              <i class="bx bx-plus me-1"></i> Tạo Đề Mới
            </button>
          </div>
        </div>
      </div>
      <div class="row mb-2">
        <div class="col-12">
          <div
            id="quizzes-list"
            class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4 mt-1"
          ></div>
          <div id="quizzes-empty" class="text-center text-muted py-5 d-none">
            <i class="bx bx-folder-open fs-1 mb-2 opacity-50"></i>
            <p>Chưa có đề thi nào. Bấm 'Tạo Đề Mới' để bắt đầu.</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal Tạo Đề Mới -->
    <div class="modal fade" id="addQuizModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 rounded-4 shadow">
          <div class="modal-header border-bottom-0 pb-0">
            <h5 class="modal-title fw-bold">Tạo bài thi mới</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <div class="mb-4">
              <label class="form-label fw-semibold text-muted small"
                >Tên bài thi</label
              >
              <input
                type="text"
                id="quiz-name-input"
                class="form-control bg-light border-0"
                placeholder="Ví dụ: Thi cuối kỳ Công Nghệ Phần Mềm..."
              />
            </div>
            <button
              type="button"
              id="btn-create-quiz"
              class="btn btn-primary w-100 rounded-pill fw-bold py-2"
            >
              Lưu Tên Đề Thi
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal Dán JSON -->
    <div class="modal fade" id="editQuizModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content border-0 rounded-4 shadow">
          <div class="modal-header border-bottom-0 pb-0">
            <h5 class="modal-title fw-bold">Nhập dữ liệu trắc nghiệm</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <div class="mb-4 bg-white p-3 rounded-3 border">
              <label class="form-label fw-bold text-dark mb-1"
                >Tên bài thi</label
              >
              <input
                type="text"
                id="edit-quiz-name-input"
                class="form-control bg-light border-0"
              />
            </div>
            <div
              class="mb-3 d-flex align-items-center justify-content-between bg-white p-3 rounded-3 border"
            >
              <div>
                <label class="form-label fw-bold text-dark mb-0"
                  >Thời gian làm bài</label
                >
                <div class="text-muted small">Mỗi lần tăng/giảm 5 phút</div>
              </div>
              <div class="d-flex align-items-center gap-3">
                <button
                  type="button"
                  id="btn-time-down"
                  class="btn btn-light border rounded-circle"
                >
                  <i class="bx bx-chevron-down fs-4"></i>
                </button>
                <span id="quiz-time-display" class="fw-bold fs-5 text-primary"
                  >15 phút</span
                >
                <button
                  type="button"
                  id="btn-time-up"
                  class="btn btn-light border rounded-circle"
                >
                  <i class="bx bx-chevron-up fs-4"></i>
                </button>
              </div>
            </div>
            <div
              class="mb-3 d-flex align-items-center justify-content-between bg-white p-3 rounded-3 border"
            >
              <div>
                <label class="form-label fw-bold text-dark mb-0"
                  >Xáo trộn câu hỏi</label
                >
              </div>
              <div class="form-check form-switch fs-4 mb-0">
                <input
                  class="form-check-input"
                  type="checkbox"
                  id="quiz-random-switch"
                  style="cursor: pointer"
                />
              </div>
            </div>
            <div class="mb-1">
              <label class="form-label fw-semibold text-muted small"
                >Dán mảng JSON AI tạo ra vào đây</label
              >
              <textarea
                id="edit-quiz-data"
                class="form-control bg-light border-0 font-monospace"
                rows="8"
              ></textarea>
            </div>
            <hr class="text-muted my-4" />
            <div class="mb-3">
              <label class="form-label fw-bold text-dark mb-2"
                >Đính kèm hình ảnh</label
              >
              <div class="row g-2 mb-3">
                <div class="col-md-4">
                  <select
                    id="question-image-select"
                    class="form-select bg-light border-0 cursor-pointer"
                  >
                    <option value="" disabled selected>-- Chọn câu --</option>
                  </select>
                </div>
                <div class="col-md-8 d-flex gap-2">
                  <input
                    type="file"
                    id="quiz-image-upload"
                    class="d-none"
                    accept="image/*"
                    multiple
                  />
                  <button
                    type="button"
                    id="btn-browse-image"
                    class="btn btn-outline-primary fw-semibold flex-fill"
                  >
                    <i class="bx bx-folder-open me-1"></i> Chọn ảnh
                  </button>
                </div>
              </div>
              <ul
                id="attached-images-list"
                class="list-group list-group-flush border rounded-3 overflow-hidden d-none mt-2"
              ></ul>
            </div>
          </div>
          <div class="modal-footer border-top-0 pt-0">
            <button
              type="button"
              class="btn btn-outline-secondary rounded-pill"
              data-bs-dismiss="modal"
            >
              Hủy
            </button>
            <button
              type="button"
              id="btn-save-quiz-data"
              class="btn btn-primary rounded-pill px-4"
            >
              Lưu Đề Thi
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal Xác Nhận Xóa -->
    <div class="modal fade" id="confirmModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered modal-sm">
        <div class="modal-content rounded-4 border-0 shadow">
          <div class="modal-header border-bottom-0 pt-4 px-4 pb-0">
            <h5 class="modal-title fw-bold text-dark">
              <i class="bx bx-error-circle text-danger me-2"></i>Xác nhận
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div
            class="modal-body px-4 py-3 text-secondary fw-semibold"
            id="confirmModalMessage"
          ></div>
          <div
            class="modal-footer border-top-0 pb-4 px-4 d-flex justify-content-end gap-2"
          >
            <button
              type="button"
              class="btn btn-light fw-bold px-4 rounded-3"
              data-bs-dismiss="modal"
            >
              Hủy
            </button>
            <button
              type="button"
              class="btn btn-danger fw-bold px-4 rounded-3"
              id="confirmModalBtn"
            >
              Đồng ý
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/toast.js"></script>
    <script src="/js/quiz.js"></script>
  </body>
</html>
