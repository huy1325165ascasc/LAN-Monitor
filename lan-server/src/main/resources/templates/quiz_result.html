<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/x-icon"
      href="../../assets/icons/favicon.ico"
    />
    <title>Kết quả bài thi - Study Space</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/take_quiz.css" />
    <link rel="stylesheet" href="/css/quiz_result.css" />
  </head>
  <body class="bg-light">
    <!-- Header -->
    <header
      class="quiz-header bg-white shadow-sm d-flex justify-content-between align-items-center px-4 py-3 sticky-top"
    >
      <div class="d-flex align-items-center gap-3">
        <h4 class="fw-bold m-0 d-flex align-items-center text-dark">
          <i class="bx bx-bar-chart-alt-2 text-primary me-2 fs-3"></i> Xem kết
          quả
        </h4>
      </div>
      <a href="/" class="btn btn-outline-danger rounded-pill fw-bold px-4">
        Thoát xem kết quả
      </a>
    </header>

    <main class="container py-5">
      <!-- Dòng thống kê thông tin -->
      <div class="row mb-5 justify-content-center">
        <div class="col-md-10">
          <div
            class="d-flex justify-content-around align-items-center bg-white p-4 rounded-4 shadow-sm border"
          >
            <div class="text-center">
              <p
                class="text-muted fw-semibold mb-1 small text-uppercase tracking-wider"
              >
                Tên bài kiểm tra
              </p>
              <h5 class="fw-bold text-dark m-0" id="res-quiz-name">
                Đang tải...
              </h5>
            </div>

            <!-- Vách ngăn -->
            <div
              style="width: 2px; height: 40px; background-color: #e2e8f0"
            ></div>

            <div class="text-center">
              <p
                class="text-muted fw-semibold mb-1 small text-uppercase tracking-wider"
              >
                Tổng điểm
              </p>
              <h3 class="fw-black text-primary m-0" id="res-score">0,00</h3>
            </div>

            <!-- Vách ngăn -->
            <div
              style="width: 2px; height: 40px; background-color: #e2e8f0"
            ></div>

            <div class="text-center">
              <p
                class="text-muted fw-semibold mb-1 small text-uppercase tracking-wider"
              >
                Thời gian đã làm
              </p>
              <h5 class="fw-bold text-dark m-0" id="res-time">00:00</h5>
            </div>
          </div>
        </div>
      </div>

      <!-- Danh sách chi tiết các câu hỏi -->
      <div class="row justify-content-center">
        <div class="col-md-10">
          <h5 class="fw-bold mb-4 text-dark border-bottom pb-3">
            Chi tiết câu trắc nghiệm đã làm
          </h5>

          <div id="result-details-list" class="d-flex flex-column gap-4 pb-5">
            <!-- JS sẽ render toàn bộ câu hỏi và đáp án ở đây -->
          </div>
        </div>
      </div>
    </main>

    <script src="/js/quiz_result.js"></script>
  </body>
</html>
