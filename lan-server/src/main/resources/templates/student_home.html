<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phòng Chờ - Chọn Bài Thi</title>

    <!-- CSS thư viện -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <!-- Header -->
    <header class="bg-white shadow-sm py-3 mb-5">
      <div class="container d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-2">
          <i class="bx bxs-graduation text-primary fs-2"></i>
          <h4 class="m-0 fw-bold text-dark">Hệ Thống Thi Trực Tuyến</h4>
        </div>
        <!-- Nút Đăng Xuất & Thông tin sinh viên -->
        <div class="d-flex align-items-center gap-3">
          <span class="fw-semibold text-secondary" id="student-name-display">
            <i class="bx bxs-user-circle me-1"></i>Đang tải...
          </span>
          <button
            onclick="logout()"
            class="btn btn-outline-danger btn-sm rounded-pill fw-bold px-3"
          >
            Đăng xuất <i class="bx bx-log-out ms-1"></i>
          </button>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="container">
      <div class="text-center mb-5">
        <h2 class="fw-bold">Danh Sách Bài Thi</h2>
        <p class="text-muted">Vui lòng chọn bài thi bên dưới để bắt đầu.</p>
      </div>

      <!-- Nơi chứa các thẻ bài thi -->
      <div class="row g-4 justify-content-center" id="quiz-container">
        <div class="col-12 text-center text-muted" id="loading-msg">
          <div class="spinner-border text-primary" role="status"></div>
          <p class="mt-2">Đang tải danh sách bài thi...</p>
        </div>
      </div>
    </main>

    <!-- Gọi file JS gọi API ở cuối cùng -->
    <script src="/js/student_home.js"></script>
  </body>
</html>
